
name: Nextsora NXS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Nextsora
        run: cargo build --release

      - name: Test Nextsora
        run: cargo test --release
        
